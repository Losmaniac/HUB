<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>American Radio Tuner</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="US Radio">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0b0d12">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' rx='40' fill='%230b0d12'/%3E%3Ccircle cx='90' cy='95' r='45' fill='none' stroke='%23e8432f' stroke-width='7'/%3E%3Cline x1='90' y1='50' x2='90' y2='35' stroke='%23e8432f' stroke-width='7' stroke-linecap='round'/%3E%3Ccircle cx='90' cy='35' r='9' fill='%233fa9f5'/%3E%3Cline x1='70' y1='95' x2='110' y2='95' stroke='%23e8432f' stroke-width='5' stroke-linecap='round'/%3E%3Cline x1='90' y1='75' x2='90' y2='115' stroke='%23e8432f' stroke-width='5' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
  html, body{ padding-top: env(safe-area-inset-top); }
</style>
<style>
  :root{
    --bg:#0b0d12;
    --panel:#141822;
    --panel2:#1b202c;
    --accent:#e8432f;
    --accent2:#3fa9f5;
    --text:#eef1f6;
    --muted:#8891a5;
    --border:#252b3a;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:radial-gradient(circle at 20% 0%, #1a1f2e 0%, var(--bg) 55%);
    color:var(--text);
    min-height:100vh;
  }
  header{
    padding:28px 24px 16px;
    text-align:center;
  }
  header h1{
    margin:0 0 6px;
    font-size:26px;
    letter-spacing:0.5px;
  }
  header h1 span{color:var(--accent);}
  header p{
    margin:0;
    color:var(--muted);
    font-size:14px;
  }
  .wrap{
    max-width:960px;
    margin:0 auto;
    padding:0 16px 40px;
  }
  .controls{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    background:var(--panel);
    border:1px solid var(--border);
    padding:14px;
    border-radius:14px;
    margin-bottom:18px;
  }
  .controls input, .controls select{
    background:var(--panel2);
    border:1px solid var(--border);
    color:var(--text);
    padding:10px 12px;
    border-radius:9px;
    font-size:14px;
    outline:none;
  }
  .controls input{flex:1 1 220px;}
  .controls select{flex:1 1 140px;}
  .controls button{
    background:var(--accent);
    color:white;
    border:none;
    padding:10px 18px;
    border-radius:9px;
    font-size:14px;
    font-weight:600;
    cursor:pointer;
  }
  .controls button:hover{filter:brightness(1.08);}
  .status{
    color:var(--muted);
    font-size:13px;
    margin:6px 4px 14px;
    min-height:16px;
  }
  .player{
    position:sticky;
    top:12px;
    z-index:5;
    background:linear-gradient(135deg,#1c2130,#171b26);
    border:1px solid var(--border);
    border-radius:14px;
    padding:16px 18px;
    margin-bottom:20px;
    display:flex;
    align-items:center;
    gap:16px;
    flex-wrap:wrap;
  }
  .player .art{
    width:52px;height:52px;border-radius:10px;
    background:var(--panel2);
    display:flex;align-items:center;justify-content:center;
    font-size:22px;
    flex:none;
    overflow:hidden;
  }
  .player .art img{width:100%;height:100%;object-fit:cover;}
  .player .meta{flex:1 1 200px;min-width:0;}
  .player .meta .name{font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .player .meta .sub{color:var(--muted);font-size:12px;margin-top:2px;}
  .player audio{flex:1 1 260px;min-width:200px;}
  .player .fav-btn{
    background:var(--panel2);
    border:1px solid var(--border);
    color:var(--text);
    border-radius:9px;
    padding:8px 12px;
    cursor:pointer;
    font-size:13px;
  }
  .player .fav-btn.active{background:var(--accent);border-color:var(--accent);}
  .tabs{
    display:flex;
    gap:6px;
    margin-bottom:12px;
  }
  .tabs button{
    background:var(--panel);
    border:1px solid var(--border);
    color:var(--muted);
    padding:8px 14px;
    border-radius:9px;
    font-size:13px;
    cursor:pointer;
  }
  .tabs button.active{
    background:var(--accent2);
    color:#08141f;
    border-color:var(--accent2);
    font-weight:700;
  }
  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(230px,1fr));
    gap:12px;
  }
  .card{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:12px;
    padding:14px;
    cursor:pointer;
    transition:transform .12s ease, border-color .12s ease;
  }
  .card:hover{
    border-color:var(--accent2);
    transform:translateY(-2px);
  }
  .card.playing{
    border-color:var(--accent);
    background:linear-gradient(135deg,#241a1a,var(--panel));
  }
  .card .top{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:8px;
  }
  .card .logo{
    width:36px;height:36px;border-radius:8px;
    background:var(--panel2);
    flex:none;
    display:flex;align-items:center;justify-content:center;
    font-size:16px;
    overflow:hidden;
  }
  .card .logo img{width:100%;height:100%;object-fit:cover;}
  .card .title{
    font-size:14px;
    font-weight:600;
    line-height:1.3;
    overflow:hidden;
    text-overflow:ellipsis;
    display:-webkit-box;
    -webkit-line-clamp:2;
    -webkit-box-orient:vertical;
  }
  .card .tags{
    color:var(--muted);
    font-size:12px;
    display:flex;
    justify-content:space-between;
    gap:6px;
  }
  .card .tags span:last-child{flex:none;}
  .empty{
    color:var(--muted);
    text-align:center;
    padding:40px 10px;
    font-size:14px;
  }
  .loading{
    text-align:center;
    padding:40px;
    color:var(--muted);
  }
  footer{
    text-align:center;
    color:var(--muted);
    font-size:12px;
    padding:20px;
  }
  footer a{color:var(--accent2);}
</style>
</head>
<body>

<header>
  <h1>American Radio <span>Tuner</span></h1>
  <p>Live US radio stations — built for accent immersion. Powered by the free Radio Browser API.</p>
</header>

<div class="wrap">

  <div class="player" id="player" style="display:none;">
    <div class="art" id="playerArt">📻</div>
    <div class="meta">
      <div class="name" id="playerName">—</div>
      <div class="sub" id="playerSub">—</div>
    </div>
    <audio id="audio" controls></audio>
    <button class="fav-btn" id="favBtn">☆ Favorite</button>
  </div>

  <div class="controls">
    <input id="searchInput" type="text" placeholder="Search station name (e.g. KROQ, NPR, Country)..." />
    <select id="stateSelect"><option value="">All states</option></select>
    <select id="genreSelect">
      <option value="">All genres</option>
      <option value="news">News / Talk</option>
      <option value="sports">Sports</option>
      <option value="rock">Rock</option>
      <option value="pop">Pop</option>
      <option value="country">Country</option>
      <option value="hip hop">Hip Hop</option>
      <option value="jazz">Jazz</option>
      <option value="classical">Classical</option>
      <option value="oldies">Oldies</option>
      <option value="christian">Christian</option>
      <option value="college">College</option>
      <option value="npr">NPR / Public Radio</option>
    </select>
    <button id="searchBtn">Search</button>
  </div>

  <div class="status" id="status"></div>

  <div class="tabs">
    <button class="active" data-tab="browse" id="tabBrowse">Browse</button>
    <button data-tab="favorites" id="tabFavorites">Favorites (0)</button>
  </div>

  <div id="results" class="grid"></div>
  <div id="favResults" class="grid" style="display:none;"></div>

</div>

<footer>
  Data &amp; streams via <a href="https://www.radio-browser.info" target="_blank">Radio Browser</a> (community-run, free, open API). Favorites are kept only for this session — they reset on reload.
</footer>

<script>
const API_SERVERS = [
  "https://de1.api.radio-browser.info",
  "https://de2.api.radio-browser.info",
  "https://at1.api.radio-browser.info"
];

let currentServer = API_SERVERS[0];
let favorites = []; // session-only, array of station objects
let currentTab = "browse";
let nowPlayingUuid = null;

const el = (id) => document.getElementById(id);
const statusEl = el("status");
const resultsEl = el("results");
const favResultsEl = el("favResults");
const audio = el("audio");
const playerEl = el("player");
const playerName = el("playerName");
const playerSub = el("playerSub");
const playerArt = el("playerArt");
const favBtn = el("favBtn");

function fmtNumber(n){
  if (n === null || n === undefined) return "0";
  return Math.round(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g, " ");
}

async function findWorkingServer(){
  for (const server of API_SERVERS){
    try{
      const res = await fetch(server + "/json/stats", { signal: AbortSignal.timeout(4000) });
      if (res.ok){ currentServer = server; return; }
    }catch(e){ /* try next */ }
  }
}

async function loadStates(){
  try{
    const res = await fetch(`${currentServer}/json/states/US/`);
    const data = await res.json();
    data.sort((a,b) => b.stationcount - a.stationcount);
    const sel = el("stateSelect");
    data.slice(0, 60).forEach(s => {
      if (!s.name) return;
      const opt = document.createElement("option");
      opt.value = s.name;
      opt.textContent = `${s.name} (${fmtNumber(s.stationcount)})`;
      sel.appendChild(opt);
    });
  }catch(e){
    console.warn("Could not load states", e);
  }
}

function stationCard(station){
  const card = document.createElement("div");
  card.className = "card" + (station.stationuuid === nowPlayingUuid ? " playing" : "");
  card.dataset.uuid = station.stationuuid;

  const favIcon = favorites.some(f => f.stationuuid === station.stationuuid) ? "★" : "";

  card.innerHTML = `
    <div class="top">
      <div class="logo">${station.favicon ? `<img src="${station.favicon}" onerror="this.parentElement.textContent='📻'"/>` : "📻"}</div>
      <div class="title">${escapeHtml(station.name || "Unnamed station")} ${favIcon}</div>
    </div>
    <div class="tags">
      <span>${escapeHtml(station.state || station.tags?.split(",")[0] || "USA")}</span>
      <span>${station.bitrate ? fmtNumber(station.bitrate) + " kbps" : ""}</span>
    </div>
  `;
  card.addEventListener("click", () => playStation(station));
  return card;
}

function escapeHtml(str){
  const d = document.createElement("div");
  d.textContent = str || "";
  return d.innerHTML;
}

function playStation(station){
  if (!station.url_resolved && !station.url) return;
  nowPlayingUuid = station.stationuuid;
  audio.src = station.url_resolved || station.url;
  audio.play().catch(() => {
    statusEl.textContent = "Playback failed for this stream — try another station (some streams are geo-blocked or offline).";
  });

  playerEl.style.display = "flex";
  playerName.textContent = station.name || "Unnamed station";
  playerSub.textContent = [station.state, station.country, station.bitrate ? fmtNumber(station.bitrate) + " kbps" : null]
    .filter(Boolean).join(" · ");
  playerArt.innerHTML = station.favicon
    ? `<img src="${station.favicon}" onerror="this.parentElement.textContent='📻'"/>`
    : "📻";

  const isFav = favorites.some(f => f.stationuuid === station.stationuuid);
  favBtn.textContent = isFav ? "★ Favorited" : "☆ Favorite";
  favBtn.classList.toggle("active", isFav);
  favBtn.onclick = () => toggleFavorite(station);

  // fire-and-forget click registration (station stats), non-blocking
  fetch(`${currentServer}/json/url/${station.stationuuid}`).catch(()=>{});

  updateMediaSession(station);
  renderCurrentTab();
}

function updateMediaSession(station){
  if (!("mediaSession" in navigator)) return;

  const artwork = station.favicon
    ? [{ src: station.favicon, sizes: "512x512", type: "image/png" }]
    : [];

  navigator.mediaSession.metadata = new MediaMetadata({
    title: station.name || "Unnamed station",
    artist: [station.state, station.country].filter(Boolean).join(", ") || "USA",
    album: "American Radio Tuner",
    artwork: artwork
  });

  navigator.mediaSession.playbackState = "playing";

  navigator.mediaSession.setActionHandler("play", () => audio.play());
  navigator.mediaSession.setActionHandler("pause", () => audio.pause());
  navigator.mediaSession.setActionHandler("stop", () => audio.pause());
}

audio.addEventListener("play", () => { if ("mediaSession" in navigator) navigator.mediaSession.playbackState = "playing"; });
audio.addEventListener("pause", () => { if ("mediaSession" in navigator) navigator.mediaSession.playbackState = "paused"; });

function toggleFavorite(station){
  const idx = favorites.findIndex(f => f.stationuuid === station.stationuuid);
  if (idx >= 0){
    favorites.splice(idx, 1);
  }else{
    favorites.push(station);
  }
  el("tabFavorites").textContent = `Favorites (${favorites.length})`;
  const isFav = favorites.some(f => f.stationuuid === station.stationuuid);
  favBtn.textContent = isFav ? "★ Favorited" : "☆ Favorite";
  favBtn.classList.toggle("active", isFav);
  renderCurrentTab();
}

function renderCurrentTab(){
  if (currentTab === "favorites"){
    favResultsEl.innerHTML = "";
    if (favorites.length === 0){
      favResultsEl.innerHTML = `<div class="empty">No favorites yet — tap ☆ Favorite on a playing station to pin it here for this session.</div>`;
    }else{
      favorites.forEach(s => favResultsEl.appendChild(stationCard(s)));
    }
  }
}

async function searchStations(){
  statusEl.textContent = "Searching...";
  resultsEl.innerHTML = `<div class="loading">Tuning in...</div>`;

  const name = el("searchInput").value.trim();
  const state = el("stateSelect").value;
  const genre = el("genreSelect").value;

  const params = new URLSearchParams({
    countrycode: "US",
    hidebroken: "true",
    order: "clickcount",
    reverse: "true",
    limit: "60"
  });
  if (name) params.set("name", name);
  if (state) params.set("state", state);
  if (genre) params.set("tag", genre);

  try{
    const res = await fetch(`${currentServer}/json/stations/search?${params.toString()}`);
    if (!res.ok) throw new Error("Request failed: " + res.status);
    let data = await res.json();

    // When this page is served over HTTPS (e.g. GitHub Pages), browsers block
    // plain-HTTP audio streams as "mixed content" — they fail silently. Hide
    // stations that can't play here so every listed station is actually tappable.
    let hiddenInsecure = 0;
    if (location.protocol === "https:"){
      const before = data.length;
      data = data.filter(s => (s.url_resolved || s.url || "").startsWith("https:"));
      hiddenInsecure = before - data.length;
    }

    resultsEl.innerHTML = "";
    if (data.length === 0){
      resultsEl.innerHTML = `<div class="empty">No playable stations matched. Try clearing a filter${hiddenInsecure ? " — some results only offer insecure (HTTP) streams that can't play on a secure page" : ""}.</div>`;
      statusEl.textContent = "0 playable stations found.";
      return;
    }
    data.forEach(s => resultsEl.appendChild(stationCard(s)));
    statusEl.textContent = `${fmtNumber(data.length)} stations found — sorted by popularity.`
      + (hiddenInsecure ? ` (${fmtNumber(hiddenInsecure)} HTTP-only stations hidden — they can't stream on a secure page.)` : "");
  }catch(e){
    resultsEl.innerHTML = `<div class="empty">Couldn't reach the station directory. Check your connection and try again.</div>`;
    statusEl.textContent = "Error loading stations.";
    console.error(e);
  }
}

function switchTab(tab){
  currentTab = tab;
  el("tabBrowse").classList.toggle("active", tab === "browse");
  el("tabFavorites").classList.toggle("active", tab === "favorites");
  resultsEl.style.display = tab === "browse" ? "grid" : "none";
  favResultsEl.style.display = tab === "favorites" ? "grid" : "none";
  if (tab === "favorites") renderCurrentTab();
}

el("searchBtn").addEventListener("click", searchStations);
el("searchInput").addEventListener("keydown", (e) => { if (e.key === "Enter") searchStations(); });
el("stateSelect").addEventListener("change", searchStations);
el("genreSelect").addEventListener("change", searchStations);
el("tabBrowse").addEventListener("click", () => switchTab("browse"));
el("tabFavorites").addEventListener("click", () => switchTab("favorites"));

(async function init(){
  statusEl.textContent = "Connecting to station directory...";
  await findWorkingServer();
  await loadStates();
  await searchStations();
})();
</script>

</body>
</html>
